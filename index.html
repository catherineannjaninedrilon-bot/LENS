<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My First Supabase Site</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #333; }
    .todo-item { background: #f4f4f4; padding: 15px; margin: 10px 0; border-left: 5px solid #3ecf8e; border-radius: 4px; font-weight: bold; font-size: 1.1em; color: #222; }
  </style>
</head>
<body>
  <h1>My Supabase Todo List</h1>
  <p>Data loaded directly from your database:</p>
  <div id="todo-container">Loading items...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // IMPORTANT: replace these with your project's values from the Supabase dashboard
    const supabaseUrl = 'https://your-project-ref.supabase.co';
    const supabaseKey = 'your-anon-public-key';

    const container = document.getElementById('todo-container');

    // Quick sanity check for placeholders
    if (supabaseUrl.includes('your-project-ref') || supabaseKey.includes('your-anon-public-key')) {
      container.innerHTML = '<p style="color: red;">Please set supabaseUrl and supabaseKey in index.html (get them from the Supabase dashboard).</p>';
      console.error('Supabase URL/key are placeholders. Replace them with your project URL and anon key from the Supabase dashboard.');
      throw new Error('Missing Supabase credentials in index.html');
    }

    const supabase = createClient(supabaseUrl, supabaseKey);

    async function fetchTodos() {
      try {
        // show a loading indicator
        container.innerText = 'Loading items...';

        // Make the query and log the raw response for debugging
        const { data, error, status } = await supabase.from('todos').select('*');
        console.log('Supabase response status:', status, 'error:', error, 'data:', data);

        if (error) {
          // Common reasons: RLS/policy denies access, wrong key, CORS/origin issues
          container.innerHTML = `<p style="color: red;">Error: ${error.message} (status: ${status})</p>`;
          console.error('Supabase error object:', error);
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = '<p>No items found! Add some rows inside your Supabase dashboard.</p>';
          return;
        }

        container.innerHTML = '';
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'todo-item';
          div.innerText = item.title ?? JSON.stringify(item);
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = `<p style="color: red;">Unexpected error: ${err.message}</p>`;
        console.error('Unexpected fetchTodos error:', err);
      }
    }

    fetchTodos();
  </script>
</body>
</html>
