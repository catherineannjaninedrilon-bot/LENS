<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LENS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fef9e7 0%, #fbf3cd 100%);
    }
    .wrapper {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #2c3e50; margin-bottom: 5px; font-weight: 800; text-shadow: 1px 1px 0px white; }
    .tagline { color: #555; font-style: italic; margin-top: 0; margin-bottom: 30px; font-size: 1.1em; }
    .card { 
      background: rgba(255, 255, 255, 0.95); 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 8px 32px rgba(183, 149, 11, 0.08); 
      margin-bottom: 20px; 
      border: 1px solid rgba(242, 237, 213, 0.6); 
    }
    .todo-item { display: flex; justify-content: space-between; align-items: center; background: #faf8f0; padding: 15px; margin: 10px 0; border-left: 5px solid #3ecf8e; border-radius: 6px; font-weight: bold; font-size: 1.1em; color: #222; }
    .form-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-group { display: flex; gap: 10px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #dcd7be; border-radius: 6px; font-size: 1em; background-color: #fffdf7; }
    button { width: 100%; padding: 12px 20px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; transition: all 0.2s ease; }
    .login-btn { background-color: #3ecf8e; }
    .login-btn:hover { background-color: #34b37a; }
    .signup-btn { background-color: #2c3e50; }
    .signup-btn:hover { background-color: #1a252f; }
    #add-btn { width: auto; background-color: #3ecf8e; white-space: nowrap; }
    .delete-btn { width: auto; background-color: #ff4d4d; padding: 6px 12px; font-size: 0.85em; }
    .delete-btn:hover { background-color: #e04343; }
    .logout-btn { background-color: #7f8c8d; margin-top: 10px; }
    .hidden { display: none; }
    .user-info { color: #666; font-style: italic; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>LENS: Learning Engagement, Navigation and Support</h1>
    <p class="tagline">See the story, support the journey</p>

    <!-- SIGN IN & SIGN UP CONTAINER -->
    <div id="login-container" class="card">
      <h3>Sign In or Create an Account</h3>
      <div class="form-group">
        <div>
          <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email Address:</label>
          <input type="text" id="email-input" placeholder="any-email@example.com" />
        </div>
        <div>
          <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password:</label>
          <input type="password" id="password-input" placeholder="Enter password" />
        </div>
        <div class="btn-group">
          <button id="login-btn" class="login-btn">Sign In</button>
          <button id="signup-btn" class="signup-btn">Create Account</button>
        </div>
      </div>
      <p id="auth-status" style="margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="hidden">
      <div class="card">
        <p class="user-info">Logged in as: <span id="user-email"></span></p>
        <button id="logout-btn" class="logout-btn">Sign Out</button>
      </div>

      <div class="card">
        <h3>Add New Item</h3>
        <div class="input-group">
          <input type="text" id="todo-input" placeholder="Type a task here..." />
          <button id="add-btn">Add Item</button>
        </div>
      </div>

      <div class="card">
        <p>Data loaded directly from your database:</p>
        <div id="todo-container">Loading items...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://jsdelivr.net';

    const supabaseUrl = 'https://supabase.co';
    const supabaseKey = 'sb_publishable_yIu-5tM1mpSkkwrdCt2vDg_M2nJkEBr';
    
    const supabase = createClient(supabaseUrl, supabaseKey, {
      auth: {
        storage: window.localStorage,
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    });

    const loginContainer = document.getElementById('login-container');
    const appContainer = document.getElementById('app-container');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userEmailSpan = document.getElementById('user-email');
    const authStatus = document.getElementById('auth-status');
    const todoContainer = document.getElementById('todo-container');
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');

    function showAppInterface(email) {
      loginContainer.style.display = 'none';
      appContainer.classList.remove('hidden');
      userEmailSpan.innerText = email;
      fetchTodos();
    }

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showAppInterface(session.user.email);
      }
    }
    checkSession();

    // NEW: Handle User Sign Up / Registration
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        alert('Please enter both an email and password to register.');
        return;
      }

      authStatus.style.color = '#333';
      authStatus.innerText = 'Creating account...';

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        alert('Registration Error: ' + error.message);
        authStatus.style.color = '#c0392b';
        authStatus.innerText = `Registration Failed: ${error.message}`;
      } else {
        alert('Account successfully created! You are now logged in.');
        showAppInterface(data.user.email);
      }
    });

    // Handle User Login
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        alert('Please enter both your email and password.');
        return;
      }
      
      authStatus.style.color = '#333';
      authStatus.innerText = 'Verifying credentials...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        alert('Login Error: ' + error.message);
        authStatus.style.color = '#c0392b';
        authStatus.innerText = `Sign In Failed: ${error.message}`;
      } else if (data && data.session) {
        showAppInterface(data.session.user.email);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.localStorage.clear();
      window.location.reload();
    });

    async function fetchTodos() {
      const { data, error } = await supabase.from('Name').select('*').order('created_at', { ascending: true });

      if (error) {
        todoContainer.innerHTML = `<p style="color: #c0392b;">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        todoContainer.innerHTML = '<p style="color: #7f8c8d;">No items found! Add a task above.</p>';
        return;
      }

      todoContainer.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'todo-item';
        
        const textSpan = document.createElement('span');
        textSpan.innerText = item.title ?? 'Untitled Item';
        div.appendChild(textSpan);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerText = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          const { error: deleteError } = await supabase.from('Name').delete().eq('id', item.id);
          if (deleteError) {
            alert(`Error deleting item: ${deleteError.message}`);
          } else {
            fetchTodos(); 
          }
        });

        div.appendChild(deleteBtn);
        todoContainer.appendChild(div);
      });
    }

    addBtn.addEventListener('click', async () => {
      const text = todoInput.value.trim();
      if (!text) return;

      const { error } = await supabase.from('Name').insert([{ title: text }]);

      if (error) {
        alert(`Error inserting data: ${error.message}`);
      } else {
        todoInput.value = ''; 
        fetchTodos(); 
      }
    });
  </script>
</body>
</html>
