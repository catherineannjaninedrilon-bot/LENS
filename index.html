<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LENS - Learning Engagement, Navigation and Support</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .todo-item {
      background: #f4f4f4;
      border-left: 4px solid #4CAF50;
      padding: 10px;
      margin: 8px 0;
      text-align: left;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Todo List</h1>
  <div id="todo-container">Loading items...</div>

  <!-- ✅ Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Correct Supabase project details
    const supabaseUrl = "https://ovjzuzjvgpzzsugasubn.supabase.co"; 
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92anp1emp2Z3B6enN1Z2FzdWJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTk3MDksImV4cCI6MjEwMjY5NTcwOX0.Uft5TwnJ7S6V1S47GMfoWujXLN49E6bqsx9b_GTYqUk";
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchTodos() {
      const { data, error } = await supabase.from("todos").select();
      if (error) {
        console.error("Error fetching todos:", error);
        document.getElementById("todo-container").innerHTML = "Failed to load items.";
        return;
      }
      const container = document.getElementById("todo-container");
      if (!data || data.length === 0) {
        container.innerHTML = "No items found.";
      } else {
        container.innerHTML = data
          .map(todo => `<div class="todo-item">${todo.task}</div>`)
          .join("");
      }
    }

    // Load todos on page load
    fetchTodos();
  </script>
</body>
</html>
