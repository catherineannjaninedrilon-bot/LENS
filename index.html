<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My First Supabase Site</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #333; }
    .todo-item { background: #f4f4f4; padding: 15px; margin: 10px 0; border-left: 5px solid #3ecf8e; border-radius: 4px; font-weight: bold; font-size: 1.1em; color: #222; }
  </style>
</head>
<body>
  <h1>My Supabase Todo List</h1>
  <p>Data loaded directly from your database:</p>
  <div id="todo-container">Loading items...</div>

  <script type="module">
    import { createClient } from 'https://jsdelivr.net';

    // Put your real details directly into the variables
    const supabaseUrl = 'https://supabase.co';
    const supabaseKey = 'sb_publishable_yIu-5tM1mpSkkwrdCt2vDg_M2nJkEBr';

    const supabase = createClient(supabaseUrl, supabaseKey);

    async function fetchTodos() {
      const container = document.getElementById('todo-container');

      // Targets your actual dashboard table named "Name"
      const { data, error } = await supabase.from('Name').select('*');

      if (error) {
        container.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p>No items found! Add some rows inside your Supabase dashboard.</p>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'todo-item';
        div.innerText = item.title ?? JSON.stringify(item);
        container.appendChild(div);
      });
    }

    fetchTodos();
  </script>
</body>
</html>
