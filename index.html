  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #fef9e7 0%, #fbf3cd 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* Moving background journey map lines layer */
    .journey-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .journey-path {
      stroke: rgba(183, 149, 11, 0.12);
      stroke-width: 6;
      stroke-dasharray: 12, 12;
      fill: none;
      animation: journeyFlow 30s linear infinite;
    }
    @keyframes journeyFlow { to { stroke-dashoffset: -240; } }

    .wrapper {
      position: relative;
      z-index: 1; 
      max-width: 1100px; 
      margin: 30px auto;
      padding: 20px;
    }
    
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #2c3e50; margin-bottom: 5px; font-weight: 800; text-shadow: 1px 1px 0px white; }
    .tagline { color: #555; font-style: italic; margin-top: 0; font-size: 1.1em; }
    
    /* Portal Gate Cards */
    .card { background: rgba(255, 255, 255, 0.94); padding: 25px; border-radius: 14px; box-shadow: 0 10px 30px rgba(183, 149, 11, 0.08); margin-bottom: 20px; border: 1px solid rgba(242, 237, 213, 0.7); backdrop-filter: blur(10px); }
    .login-card { max-width: 450px; margin: 60px auto; border-top: 5px solid #2c3e50; }
    .form-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
    
    /* Two-Column Dashboard Layout */
    .dashboard-grid { display: grid; grid-template-columns: 1.2fr 1.8fr; gap: 20px; }
    @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

    /* School Banner Framework with backdrop image asset */
    .dashboard-banner {
      grid-column: 1 / -1;
      position: relative;
      background-color: #2c3e50;
      background-image: linear-gradient(rgba(44, 62, 80, 0.75), rgba(44, 62, 80, 0.85)), url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 35px 30px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(44, 62, 80, 0.15);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .banner-text h2 { margin: 0; font-size: 1.8em; font-weight: 800; letter-spacing: 0.5px; }
    .banner-text p { margin: 6px 0 0 0; opacity: 0.9; font-size: 1em; }

    /* Performance Analytics Monitor Grid Matrix */
    .stats-matrix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
    .stat-box { text-align: center; padding: 15px 10px; background: #fffdf7; border-radius: 10px; border: 1px solid #f2edd5; box-shadow: 0 2px 5px rgba(0,0,0,0.01); }
    .stat-box.full-width { grid-column: 1 / -1; background: #fbf9f0; }
    .stat-number { font-size: 1.8em; font-weight: 800; color: #2c3e50; margin-bottom: 2px; }
    .stat-label { color: #555; font-size: 0.85em; font-weight: bold; text-transform: uppercase; letter-spacing: 0.3px; }

    /* Recent activities ledger logs */
    .activity-stream { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
